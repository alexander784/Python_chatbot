<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Chatbot</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 80vh;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideInRight 0.3s ease;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideInLeft 0.3s ease;
        }

        .chat-footer {
            padding: 10px;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 1em;
            margin-right: 10px;
        }

        #userInput:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        #sendButton {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        #sendButton:hover {
            background-color: #0056b3;
        }

        .chat-body::-webkit-scrollbar {
            width: 8px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 500px) {
            .chat-container {
                width: 90%;
                height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chatbot Assistant</div>
        <div class="chat-body" id="chatOutput"></div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let message = $('#userInput').val().trim();
            if (!message) return; 

            $('#chatOutput').append(
                `<div class="chat-message"><div class="user-message">${message}</div></div>`
            );
            $('#userInput').val(''); 

            $('#chatOutput').scrollTop($('#chatOutput')[0].scrollHeight);

            $.get('/get/', { userMessage: message }, function (data) {
                $('#chatOutput').append(
                    `<div class="chat-message"><div class="bot-message">${data.response}</div></div>`
                );
                $('#chatOutput').scrollTop($('#chatOutput')[0].scrollHeight);
            }).fail(function () {
                $('#chatOutput').append(
                    `<div class="chat-message"><div class="bot-message">Sorry, something went wrong.</div></div>`
                );
                $('#chatOutput').scrollTop($('#chatOutput')[0].scrollHeight);
            });
        }

        $('#userInput').keypress(function (e) {
            if (e.which === 13) {
                sendMessage();
            }
        });

        $('#userInput').focus();
    </script>
</body>
</html>
